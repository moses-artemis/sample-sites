<style>

:root {

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--sans); font-size: 14px; color: var(--ink); background: var(--bg); }
button, input { font: inherit; color: inherit; background: none; border: 0; padding: 0; }
button { cursor: pointer; }
.app { display: flex; height: 100vh; }
.rail { width: 240px; flex: none; display: flex; flex-direction: column; background: var(--bg); border-right: 1px solid var(--line); transition: width .2s; overflow: hidden; }
.rail.closed { width: 52px; }
.brand { display: flex; align-items: center; gap: 8px; height: 56px; padding: 0 12px; flex: none; }
.rail.closed .brand { flex-wrap: wrap; justify-content: center; height: auto; padding: 8px 0 4px; gap: 4px; }
.brand img { width: 22px; height: 22px; flex: none; }
.word { height: 14px; width: auto; color: var(--ink); }
.rail.closed .word, .rail.closed .lbl, .rail.closed .sec, .rail.closed .badge, .rail.closed .orgname, .rail.closed .who { display: none; }
.navscroll { flex: 1; overflow: auto; padding: 4px 8px 12px; }
.sec { margin: 14px 8px 6px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.nav, .sub { display: flex; align-items: center; gap: 8px; width: 100%; height: 32px; padding: 0 8px; border-radius: 6px; color: var(--ink); text-align: left; }
.nav:hover, .sub:hover { background: #ececee; }
.nav.on, .sub.on { background: var(--active); font-weight: 500; }
.sub { padding-left: 32px; height: 30px; color: #3f3f46; }
.ico { width: 16px; height: 16px; flex: none; }
.lbl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badge { margin-left: auto; font-size: 10px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 0 6px; }
.foot { flex: none; border-top: 1px solid var(--line); padding: 8px; display: flex; align-items: center; gap: 8px; }
.rail.closed .foot { flex-direction: column; padding: 8px 0; }
.av { width: 28px; height: 28px; border-radius: 999px; background: #d6e86a; color: #30360d; display: grid; place-items: center; font-size: 12px; font-weight: 600; flex: none; }
.orgname { font-size: 13px; font-weight: 500; }
.who { font-size: 12px; color: var(--muted); }
.collapse { margin-left: auto; width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; color: var(--muted); }
.collapse:hover { background: #ececee; color: var(--ink); }
.rail.closed .collapse { margin: 0; }
.main { flex: 1; min-width: 0; background: var(--card); display: flex; flex-direction: column; }
.top { min-height: 56px; flex: none; display: flex; align-items: center; gap: 12px; padding: 8px 24px; border-bottom: 1px solid var(--line); position: relative; flex-wrap: wrap; }
.top h1 { font-size: 16px; font-weight: 600; margin: 0; }
.grow { flex: 1; }
.scroll { flex: 1; overflow: auto; padding: 20px 24px 32px; }
.muted { color: var(--muted); }
.row { display: flex; align-items: center; gap: 8px; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
.kpi, .card { border: 1px solid var(--line); border-radius: 8px; background: #fff; padding: 14px; }
.kpi b { display: block; font-size: 22px; font-weight: 560; margin-top: 4px; }
.tools { display: flex; gap: 8px; margin-bottom: 12px; }
.search { display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 6px; padding: 0 8px; height: 32px; min-width: 220px; }
.search input { outline: none; width: 100%; }
.btn { height: 32px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--line); background: #fff; }
.btn.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--hover); }
.pill { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 12px; background: #f4f4f5; color: #3f3f46; }
.pill.critical { background: #fee2e2; color: #991b1b; }
.pill.high { background: #ffedd5; color: #9a3412; }
.pill.medium { background: #fef9c3; color: #854d0e; }
.pill.low { background: #f4f4f5; color: #3f3f46; }
.pill.ok { background: #dcfce7; color: #166534; }
.pill.warn { background: #fef9c3; color: #854d0e; }
.pill.bad { background: #fee2e2; color: #991b1b; }
.pill.tp { background: #dbeafe; color: #1e3a8a; }
.logo { width: 18px; height: 18px; display: inline-block; vertical-align: middle; }
.logo img, .logo svg { width: 18px; height: 18px; display: block; }
.tabs { display: flex; gap: 16px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
.tabs button { height: 36px; color: var(--muted); border-bottom: 2px solid transparent; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--ink); font-weight: 500; }
.h2 { font-size: 15px; font-weight: 600; margin: 0 0 8px; }
.grid2 { display: grid; grid-template-columns: 1.2fr .8fr; gap: 12px; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.find { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.chat { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; min-height: 100%; }
.bubble { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.bubble.user { background: #f4f4f5; }
.composer { display: flex; gap: 8px; border: 1px solid var(--line); border-radius: 10px; padding: 8px; margin-top: auto; }
.composer input { flex: 1; outline: none; }
.bars { display: flex; align-items: flex-end; gap: 8px; height: 120px; }
.bars i { flex: 1; background: #c7d2fe; border-radius: 4px 4px 0 0; display: block; }
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.check { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--line); }
.box { width: 16px; height: 16px; border: 1px solid #a1a1aa; border-radius: 4px; flex: none; margin-top: 2px; }
.box.on { background: var(--blue); border-color: var(--blue); }
.path { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.node { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: #fff; }
.signin { min-height: 100vh; display: grid; place-items: center; background: #f3f3f4; }
.card-login { width: 400px; background: #fff; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,.06); padding: 36px 28px 28px; text-align: center; }
.card-login h1 { font-size: 22px; margin: 16px 0 22px; }
.sso { width: 100%; height: 42px; border: 1px solid #e4e4e7; border-radius: 8px; margin: 8px 0; display: flex; align-items: center; justify-content: center; gap: 8px; background: #fff; }
.sso:hover { background: #fafafa; }
.fine { font-size: 13px; margin-top: 16px; }
.note { font-size: 12px; color: var(--muted); margin-top: 14px; }
.crumbs { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 12px; margin-bottom: 2px; }
.crumbs button { color: var(--blue-text); }
.range { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.range button { height: 32px; padding: 0 10px; }
.range button.on { background: #18181b; color: #fff; }
.search { position: relative; min-width: 240px; }
.hits, .pop { position: absolute; background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.08); z-index: 6; }
.hits { top: 36px; left: 0; width: 360px; padding: 6px; }
.pop { right: 16px; top: 48px; width: 340px; padding: 8px; }
.hits button, .pop button, .linkrow, .bcard, .sess button { display: flex; gap: 8px; align-items: center; width: 100%; text-align: left; padding: 8px; border-radius: 6px; }
.hits button:hover, .pop button:hover, .linkrow:hover, .sess button:hover, .bcard:hover { background: #f4f4f5; }
.sess button.on { background: var(--active); }
.bell { position: relative; width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; }
.bell:hover, .bell.on { background: #ececee; }
.dot { position: absolute; top: 4px; right: 4px; min-width: 14px; height: 14px; border-radius: 99px; background: #334deb; color: #fff; font-size: 10px; display: grid; place-items: center; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; align-items: center; }
.chip { height: 28px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line); background: #fff; font-size: 12px; }
.chip.on { background: #18181b; color: #fff; border-color: #18181b; }
.tablewrap { overflow: auto; border: 1px solid var(--line); border-radius: 8px; }
.tablewrap table { border: 0; }
.hrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.hrow .h2 { margin: 0; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.vrow { display: grid; grid-template-columns: 130px 1fr 36px; gap: 8px; align-items: center; margin: 6px 0; font-size: 13px; }
.track { height: 8px; background: #f4f4f5; border-radius: 99px; }
.track i { display: block; height: 100%; border-radius: 99px; }
.donut { width: 96px; height: 96px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.donut span { width: 60px; height: 60px; border-radius: 50%; background: #fff; display: grid; place-items: center; font-weight: 600; }
.sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.tag { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 999px; background: #f4f4f5; font-size: 12px; margin: 0 4px 4px 0; }
.lanes, .board { display: grid; gap: 8px; }
.lanes { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.board { grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: start; }
.lane, .bcol { border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: #fff; }
.bcol { background: #fafafa; }
.lane b, .big { display: block; font-size: 22px; font-weight: 560; }
.bcard { display: block; background: #fff; border: 1px solid var(--line); margin-bottom: 8px; }
.matrix { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.mcol h3 { margin: 0 0 6px; font-size: 11px; font-weight: 500; color: var(--muted); }
.cell { height: 18px; border-radius: 3px; margin-bottom: 3px; }
.cell.cov { background: #86efac; }
.cell.part { background: #fde68a; }
.cell.gap { background: #fecaca; }
.split, .set, .aiwrap { display: grid; gap: 16px; }
.split { grid-template-columns: 1.4fr .8fr; }
.set { grid-template-columns: 220px 1fr; }
.aiwrap { grid-template-columns: 240px 1fr; min-height: 520px; }
.side .kv { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.ask h2 { margin: 0 0 8px; font-size: 20px; }
.toast { position: fixed; bottom: 16px; right: 16px; background: #18181b; color: #fff; padding: 10px 14px; border-radius: 8px; z-index: 8; display: flex; gap: 12px; align-items: center; }
.tool { border: 1px dashed var(--line); border-radius: 8px; padding: 8px 10px; margin: 8px 0; font-size: 13px; }
.mono { font-family: var(--mono); font-size: 13px; }
@media (max-width: 1000px) { .kpis, .cards, .grid2, .grid3, .lanes, .board, .split, .set, .aiwrap, .matrix { grid-template-columns: 1fr; } }

  return parts.map((p) => `<div class="vrow"><span>${esc(p[0])}</span><div class="track"><i style="width:${Math.round(p[1] / max * 100)}%;background:${p[2] || "#c7d2fe"}"></i></div><b>${p[1]}</b></div>`).join("");
}
function hbars(values) {
  const max = Math.max(...values, 1);
  return `<div class="bars">${values.map((v) => `<i style="height:${Math.round(v / max * 100)}%"></i>`).join("")}</div>`;
}
function donut(parts) {
  const total = parts.reduce((s, p) => s + p[1], 0) || 1;
  let acc = 0;
  const stops = parts.map((p) => { const start = acc; acc += (p[1] / total) * 100; return `${p[2]} ${start.toFixed(2)}% ${acc.toFixed(2)}%`; }).join(",");
  const legend = parts.map((p) => `<div><i class="sw" style="background:${p[2]}"></i> ${esc(p[0])} <b>${p[1]}</b></div>`).join("");
  return `<div class="row" style="align-items:center;gap:16px"><div class="donut" style="background:conic-gradient(${stops})"><span>${total}</span></div><div class="stack">${legend}</div></div>`;
}

  if (id === "users") return table(["Name", "Email", "Role", "Last seen"], portalUsers.map((u) => `<tr><td>${esc(u[0])}</td><td>${esc(u[1])}</td><td>${esc(u[2])}</td><td>${esc(u[3])}</td></tr>`));
  if (id === "authentication") return `<div class="card"><b>Methods</b><p>Google, Microsoft, and SSO are shown on the sample sign-in card. No identity provider is connected from this page.</p><button class="btn" data-go="signin" type="button">View the sign-in card</button></div>`;
  if (id === "api-keys" || id === "secrets") return `<div class="card"><b>Nothing stored</b><p class="muted">No token is stored here.</p></div>`;
  if (id === "ai-mode" || id === "ai-actions") return `<div class="card"><b>Sample budget</b><p>200 questions a day for this workspace. Nothing is sent.</p><button class="btn" data-go="ai" type="button">Open AI Mode</button></div>`;
  if (id === "audit-trail") return table(["When", "Actor", "Action", "Target"], auditRows.map((r) => `<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td>${esc(r[3])}</td></tr>`));
  if (id === "organization-context") return `<div class="card"><b>Knowledge</b><p>Finance laptops use the FIN-LT prefix. The analytics-export role is a scheduled job. Push prompts are still allowed for six privileged users.</p></div>`;
  if (id === "lookup-tables") return table(["Table", "Rows", "Used by"], [[ "vip-users", "12", "MFA fatigue detector" ], [ "export-roles", "3", "GetObject detector" ]].map((r) => `<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`));
  if (id === "roles") return table(["Role", "People", "Can"], [["Admin", "1", "Settings and workflows"], ["Analyst", "2", "Cases, hunts, and response"], ["Viewer", "0", "Read lists"]].map((r) => `<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`));
  if (id === "ioc-management") return `<div class="card"><p>${iocs.filter((i) => i.status === "Active").length} active indicators in the sample.</p><button class="btn" data-go="iocs" type="button">Open IOC Management</button></div>`;
  if (id === "file-allowlist") return table(["Hash", "Note"], [["44d88612fea8a8f36de82e1278abb02f", "Known installer"]].map((r) => `<tr><td class="mono">${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`));
  if (id === "detectors") return `<div class="card"><p>New detectors in this sample start in a learning period. ${detectors.filter((d) => d.status === "Test").length} are there now.</p><button class="btn" data-go="lifecycle" type="button">Open lifecycle</button></div>`;
  if (id === "reports") return `<div class="card"><p>No scheduled report is sent from this sample.</p><button class="btn" data-set="toast:Sample only. No report file is created." type="button">Download PDF</button></div>`;
  if (id === "license") return `<div class="card"><b>Sample workspace</b><p>artdogfood · one workspace · not an Apollo parent.</p></div>`;
  return `<div class="card"><b>Organization</b><p>artdogfood · sample workspace · UTC.</p><p class="muted">Display name, timezone, and retention are shown here. Nothing is saved.</p></div>`;
}
function settingsPage() {
  const id = SETTINGS.some((s) => s[0] === route().id) ? route().id : "general";
  const label = SETTINGS.find((s) => s[0] === id)[1];
  return shell("Settings", `<div class="set"><div class="card">${SETTINGS.map((s) => `<button class="linkrow${s[0] === id ? " on" : ""}" data-go="settings/${s[0]}" type="button">${esc(s[1])}</button>`).join("")}</div><div><div class="h2">${esc(label)}</div>${settingsBody(id)}</div></div>`, { crumbs: [["Settings", "settings/general"], [label]] });
}
function startPage() {
  const steps = [["Connect a source", "connectors", true], ["Invite an analyst", "settings/users", true], ["Review the first case", "cases", true], ["Ask AI Mode", "ai", false], ["Enable a detector", "detectors", false], ["Save a threat hunt", "hunts", false]];
  return shell("Getting started", steps.map((s, i) => `<div class="check"><span class="box${s[2] ? " on" : ""}"></span><div><b>${i + 1}. ${esc(s[0])}</b><div><button class="btn" data-go="${s[1]}" type="button">Open</button></div></div></div>`).join(""), { crumbs: [["Getting started"]] });
}
function signinPage() {
  return `<div class="signin"><div class="card-login"><img src="logos/Artemis.svg" width="42" height="42" alt="Artemis"><h1>Welcome to Artemis</h1>
    <button class="sso" data-go="home" type="button"><img src="logos/Google.svg" width="16" height="16" alt=""> Continue with Google</button>
    <button class="sso" data-go="home" type="button"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect width="7" height="7" fill="#f25022"/><rect x="9" width="7" height="7" fill="#7fba00"/><rect y="9" width="7" height="7" fill="#00a4ef"/><rect x="9" y="9" width="7" height="7" fill="#ffb900"/></svg> Continue with Microsoft</button>
    <button class="sso" data-go="home" type="button">${icon("key")} Continue with SSO</button>
    <p class="fine">By continuing, I agree to the Company's Privacy Statement and Terms of Service</p>
    <p class="note">Sample only. These buttons open the sample workspace. They do not sign in to artdogfood.portal.goartemis.ai.</p>
  </div></div>`;
}
const pages = {
  home: homePage, ai: aiPage, cases: casesPage, case: casePage, finding: findingPage, hunts: huntsPage, hunt: huntPage, logs: logsPage,
  operational: operationalPage, ei: eiPage, coverage: coveragePage, lifecycle: lifecyclePage, performance: performancePage, mdr: mdrPage, templates: templatesPage, custom: customPage,
  insights: insightsPage, insight: insightPage, findings: findingsPage, inventory: inventoryPage, paths: pathsPage,
  detectors: detectorsPage, detector: detectorPage, iocs: iocsPage, workflows: workflowsPage, workflow: workflowPage,
  connectors: connectorsPage, connector: connectorPage, pipelines: pipelinesPage, settings: settingsPage, start: startPage, signin: signinPage
};
function bind() {
  document.querySelectorAll("[data-go]").forEach((el) => el.addEventListener("click", (e) => { e.preventDefault(); q = ""; notesOpen = false; go(el.getAttribute("data-go")); }));
  document.querySelectorAll("[data-toggle]").forEach((el) => el.addEventListener("click", (e) => {
    e.preventDefault();
    const t = el.getAttribute("data-toggle");
    if (t === "dash") dashOpen = !dashOpen;
    if (t === "notes") notesOpen = !notesOpen;
    render();
  }));
  document.querySelectorAll("[data-set]").forEach((el) => el.addEventListener("click", (e) => {
    e.preventDefault();
    const raw = el.getAttribute("data-set");
    const i = raw.indexOf(":");
    const k = raw.slice(0, i);
    const v = raw.slice(i + 1);
    if (k === "range") range = v;
    if (k === "framework") framework = v;
    if (k === "view") caseView = v;
    if (k === "toast") toast = v;
    if (k === "sev") filters.sev = filters.sev === v ? "" : v;
    if (k === "status") filters.status = filters.status === v ? "" : v;
    if (k === "judge") filters.judge = filters.judge === v ? "" : v;
    if (k === "type") filters.type = filters.type === v ? "" : v;
    render();
  }));
  document.querySelectorAll("[data-ask]").forEach((el) => el.addEventListener("click", () => { askText = el.getAttribute("data-ask"); go("ai"); }));
  const tog = document.getElementById("rail-toggle");
  if (tog) tog.addEventListener("click", () => { railOpen = !railOpen; render(); });
  const qel = document.getElementById("q");
  if (qel) qel.addEventListener("input", () => { q = qel.value; const pos = qel.selectionStart; render(); const n = document.getElementById("q"); if (n) { n.focus(); n.setSelectionRange(pos, pos); } });
  const ask = document.getElementById("ask");
  if (ask) ask.addEventListener("click", () => { const n = document.getElementById("askq"); askText = n ? n.value : askText; if (route().page !== "ai") go("ai"); else render(); });
  const run = document.getElementById("runlog");
  if (run) run.addEventListener("click", () => { const n = document.getElementById("logq"); if (n) logQuery = n.value; render(); });
}
function render() {
  const page = route().page;
  if (page in DASH_PAGES && page !== lastPage) dashOpen = true;
  lastPage = page;
  const draw = pages[page] || (() => shell("Not in this sample", `<p>This route is not one of the sample screens.</p><button class="btn" data-go="home" type="button">Overview</button>`));
  document.getElementById("root").innerHTML = draw();
  document.title = page === "signin" ? "Login - Artemis" : "Artemis";
  bind();
}
window.addEventListener("hashchange", () => {
  if (route().page !== "ai") q = "";
  filters = { sev: "", status: "", judge: "", type: "" };
  notesOpen = false;
  toast = "";
  render();
});
if (!location.hash) location.hash = "#/home";
render();
</script>
</body>
</html>
