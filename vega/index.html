<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vega</title>
<link rel="icon" href="favicon.svg">
<style>
@font-face { font-family: Geist; src: url("fonts/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
@font-face { font-family: "Geist Mono"; src: url("fonts/GeistMono-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
:root {
  --bg: #fbfaf9; --fg: #121211; --card: #fff; --muted: #fbfaf9; --muted-fg: #595755;
  --subtle: #8b8983; --border: #ecebe9; --border-em: #dbdad6; --secondary: #f2f0ee;
  --brand: #295c55; --brand-800: #074740; --logo: #074740;
  --active-bg: #ecebe9; --item: #8b8983; --positive: #4b7e3b; --warning: #d0740f;
  --destructive: #cc2c2b; --sev-low: #4796b0; --sev-med: #eb9915; --sev-high: #e4582b; --sev-crit: #a82120;
  --radius: 8px; --sans: Geist, Inter, sans-serif; --mono: "Geist Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font-family: var(--sans); color: var(--fg); background: var(--bg); font-size: 14px; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
.ico { width: 16px; height: 16px; flex: 0 0 16px; display: block; }
.ico.lg { width: 18px; height: 18px; flex-basis: 18px; }
.logo { height: 20px; width: 58px; color: var(--logo); }
.app { display: flex; height: 100%; min-width: 0; }
nav.rail { flex: 0 0 200px; width: 200px; display: flex; flex-direction: column; transition: width .2s cubic-bezier(.2,0,0,1); background: var(--bg); }
nav.rail.collapsed { flex-basis: 44px; width: 44px; }
.rail-top { display: flex; align-items: center; justify-content: space-between; padding: 16px 12px 8px; gap: 8px; }
.rail.collapsed .rail-top { padding: 16px 6px 8px; justify-content: center; }
.brand { display: flex; overflow: hidden; }
.rail.collapsed .brand { max-width: 0; opacity: 0; }
.icon-btn { width: 24px; height: 24px; border: 0; background: transparent; border-radius: 2px; color: var(--item); display: grid; place-items: center; position: relative; }
.icon-btn:hover { background: var(--secondary); color: var(--fg); }
.icon-btn .when-open, .icon-btn .when-shut { position: absolute; }
.rail.collapsed .icon-btn .when-open { opacity: 0; }
.rail:not(.collapsed) .icon-btn .flower, .rail:not(.collapsed) .icon-btn .when-shut { opacity: 0; }
.rail.collapsed .icon-btn:hover .flower { opacity: 0; }
.rail.collapsed .icon-btn:hover .when-shut { opacity: 1; }
.rail-scroll { flex: 1; overflow: auto; padding: 4px 8px 8px; display: flex; flex-direction: column; gap: 2px; }
.nav-btn, .back-btn { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: transparent; border-radius: 2px; color: var(--item); text-align: left; padding: 6px 8px; min-height: 32px; }
.nav-btn:hover, .back-btn:hover { background: var(--secondary); color: var(--fg); }
.nav-btn.on { background: var(--active-bg); color: var(--brand-800); }
.nav-btn .lbl, .back-btn .lbl, .soon { white-space: nowrap; overflow: hidden; }
.rail.collapsed .lbl, .rail.collapsed .soon, .rail.collapsed .tenant b, .rail.collapsed .tenant small { display: none; }
.soon { margin-left: auto; font-size: 10px; color: var(--subtle); }
.rail-bottom { margin-top: auto; display: flex; flex-direction: column; gap: 2px; }
.tenant { display: flex; align-items: center; gap: 8px; margin: 8px; padding: 8px; border: 0; background: transparent; border-radius: 2px; text-align: left; }
.tenant:hover { background: var(--secondary); }
.mark { width: 16px; height: 16px; border-radius: 3px; background: var(--brand-800); color: #fff; display: grid; place-items: center; flex: 0 0 16px; }
.mark svg { width: 12px; height: 12px; }
.tenant b { display: block; font-size: 12px; font-weight: 600; }
.tenant small { display: block; color: var(--subtle); font-size: 11px; }
.stage { flex: 1; min-width: 0; padding: 8px 8px 8px 0; display: flex; }
.panel { flex: 1; min-width: 0; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); display: flex; flex-direction: column; overflow: hidden; }
.top { min-height: 48px; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-bottom: 1px solid var(--border); }
.crumbs { display: flex; align-items: center; gap: 6px; color: var(--muted-fg); font-size: 13px; min-width: 0; }
.crumbs b { color: var(--fg); font-weight: 600; }
.slash { opacity: .45; }
.spacer { flex: 1; }
.scroll { flex: 1; overflow: auto; }
.pad { padding: 16px 20px 28px; }
h1 { font-size: 20px; line-height: 1.3; margin: 0; font-weight: 600; }
.h1row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.count { color: var(--muted-fg); font-size: 13px; }
.tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.chip, .btn, .seg button { border: 1px solid var(--border-em); background: #fff; border-radius: 6px; padding: 4px 8px; font-size: 12px; display: inline-flex; align-items: center; gap: 6px; }
.chip.on, .seg button.on { background: var(--secondary); border-color: var(--border-em); }
.btn.primary { background: var(--brand); color: #fff; border-color: var(--brand); }
.btn.ghost, .linkish { border: 0; background: transparent; color: var(--brand); padding: 0; }
.seg { display: inline-flex; border: 1px solid var(--border-em); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; border-right: 1px solid var(--border); border-radius: 0; }
.seg button:last-child { border-right: 0; }
.search { margin-left: auto; display: flex; align-items: center; gap: 6px; border: 1px solid var(--border-em); border-radius: 6px; padding: 4px 8px; min-width: 180px; }
.search input { border: 0; outline: 0; width: 100%; background: transparent; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 500; color: var(--subtle); font-size: 12px; padding: 8px 10px; border-bottom: 1px solid var(--border); background: #fbfaf9; position: sticky; top: 0; }
td { padding: 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tr.click { cursor: pointer; }
tr.click:hover td { background: #fbfaf9; }
.name b { display: block; font-weight: 600; }
.name small, .mono { font-family: var(--mono); color: var(--subtle); font-size: 12px; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 4px; padding: 2px 6px; font-size: 12px; background: var(--secondary); }
.pill i { width: 8px; height: 8px; border-radius: 2px; display: block; }
.sev { color: #fff; border-radius: 4px; padding: 2px 6px; font-size: 12px; font-weight: 600; }
.who { display: inline-flex; align-items: center; gap: 6px; }
.av { width: 18px; height: 18px; border-radius: 50%; color: #fff; display: grid; place-items: center; font-size: 10px; font-weight: 700; }
.src { display: inline-flex; align-items: center; gap: 6px; }
.funnel { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px; }
.stage-card { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; background: #fff; text-align: left; }
.stage-card.on { outline: 2px solid var(--brand); }
.stage-card b { display: block; font-size: 18px; }
.bars { display: flex; height: 6px; border-radius: 99px; overflow: hidden; margin-top: 8px; background: var(--secondary); }
.bars span { display: block; height: 100%; }
.tabs { display: flex; gap: 4px; padding: 0 8px; border-bottom: 1px solid var(--border); }
.tabs button { border: 0; background: transparent; padding: 10px 12px; color: var(--muted-fg); border-bottom: 2px solid transparent; }
.tabs button.on { color: var(--brand-800); border-bottom-color: var(--brand); font-weight: 600; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.card { border: 1px solid var(--border); border-radius: 8px; padding: 14px; background: #fff; text-align: left; }
.card h3 { margin: 8px 0 4px; font-size: 14px; }
.card p { margin: 0; color: var(--muted-fg); font-size: 12px; }
.composer { border: 1px solid var(--border-em); border-radius: 12px; padding: 12px; max-width: 760px; }
.composer textarea { width: 100%; border: 0; resize: vertical; min-height: 72px; outline: 0; }
.modes { display: flex; gap: 6px; margin-bottom: 8px; }
.suggest { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.kv { display: grid; grid-template-columns: 160px 1fr; gap: 8px 12px; max-width: 720px; }
.kv span { color: var(--subtle); }
.note { color: var(--subtle); font-size: 12px; margin-top: 16px; }
.login { min-height: 100%; display: flex; align-items: center; justify-content: center; background: var(--bg); }
.auth { width: 420px; max-width: calc(100% - 32px); background: #fff; border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 4px 16px rgba(18,18,17,.06); padding: 28px; display: flex; flex-direction: column; gap: 16px; }
.auth h1 { text-align: center; font-size: 22px; }
.auth .logo-wrap { display: flex; justify-content: center; color: var(--brand-800); }
.auth .logo-wrap svg { width: 92px; height: 32px; }
label.fld { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
label.fld input { border: 1px solid var(--border-em); border-radius: 6px; padding: 8px 10px; }
.or { display: flex; align-items: center; gap: 8px; color: var(--subtle); font-size: 12px; }
.or i { flex: 1; height: 1px; background: var(--border); }
.stack { display: flex; flex-direction: column; gap: 8px; }
.foot { text-align: center; color: var(--subtle); font-size: 12px; }
.empty { padding: 32px; text-align: center; color: var(--muted-fg); }
.toast { position: fixed; bottom: 16px; right: 16px; background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; box-shadow: 0 8px 24px rgba(0,0,0,.08); }
</style>
</head>
<body>
<div id="root"></div>
<script>
const NAV = [
  { path: "/search", name: "Search", icon: "sidebar-search" },
  { path: "/notebooks", name: "Notebooks", icon: "sidebar-notebook", soon: true, children: [
    ["/notebooks/my", "My notebooks"], ["/notebooks/library", "Vega library"]
  ]},
  { path: "/dashboards", name: "Dashboards", icon: "sidebar-dashboard" },
  { path: "/assessment", name: "Assessment", icon: "sidebar-assessment", children: [
    ["/assessment/mitre", "MITRE coverage"], ["/assessment/discovery", "Data discovery"],
    ["/assessment/plan", "Action plan"], ["/assessment/detections", "Detections"]
  ]},
  { path: "/detections", name: "Detections", icon: "sidebar-detections", soon: true, children: [
    ["/detections/my", "Configured detections"], ["/detections/library", "Vega library"], ["/detections/external", "SIEM detections"]
  ]},
  { path: "/incidents", name: "Incidents", icon: "sidebar-incidents", children: [
    ["/incidents/list", "Incidents"], ["/incidents/signals", "Signals"]
  ]},
  { path: "/agentic", name: "Agents", icon: "sidebar-settings-ai-preferences", children: [
    ["/agentic/skills", "Skills"], ["/agentic/memories", "Memories"]
  ]},
  { path: "/intel", name: "Threat Intel", icon: "sidebar-ti-hub", soon: true },
  { path: "/connectors", name: "Connectors", icon: "sidebar-connectors", section: "bottom", children: [
    ["/connectors/library", "Connector library"], ["/connectors/configured", "Configured connections"]
  ]},
  { path: "/settings", name: "Settings", icon: "sidebar-settings", section: "bottom", children: [
    ["/settings/users", "Users"], ["/settings/groups", "Groups"], ["/settings/roles", "Roles"],
    ["/settings/access-keys", "Access keys"], ["/settings/scopes", "Scopes"],
    ["/settings/audit-log", "Audit log"], ["/settings/connector-requests", "Connector requests"],
    ["/settings/lookup-tables", "Lookup tables"], ["/settings/labels", "Labels"],
    ["/settings/webhook-rules", "Webhook rules"], ["/settings/automations", "Automations"],
    ["/settings/ai-preferences", "AI preferences"], ["/settings/time-preferences", "Time preferences"],
    ["/settings/sso", "SSO"]
  ]}
];
const PEOPLE = [
  ["A. Example", "#295c55", "a.example@example.com"],
  ["M. Sample", "#3657da", "m.sample@example.com"],
  ["J. Demo", "#815fc8", "j.demo@example.com"],
  ["P. North", "#d54021", "p.north@example.com"],
  ["S. Case", "#4b7e3b", "s.case@example.com"]
];
const SOURCES = [
  ["okta", "Okta"], ["microsoft-entraid", "Microsoft Entra ID"], ["crowdstrike-falcon", "CrowdStrike Falcon"],
  ["amazon-s3", "Amazon S3"], ["cloudtrail", "CloudTrail"], ["github", "GitHub"],
  ["google", "Google"], ["sentinel", "Microsoft Sentinel"], ["splunk", "Splunk"], ["wiz", "Wiz"]
];
const SIGNALS = [
  ["sig-1", "Unusual sign-in from a documentation network", "unusual_signin_docnet", "Open", "okta", "Critical", "198.51.100.24", "a.example@example.com", 0, "Suspicious", false],
  ["sig-2", "New OAuth grant on a sample application", "oauth_grant_sample_app", "Open", "microsoft-entraid", "High", "203.0.113.10", "m.sample@example.com", 1, "Suspicious", false],
  ["sig-3", "Sample process started a network connection", "sample_process_network", "In progress", "crowdstrike-falcon", "High", "FIN-SAMPLE-14", "192.0.2.40", 2, "Malicious", false],
  ["sig-4", "Object upload to an example bucket", "sample_object_upload", "Open", "amazon-s3", "Medium", "sample-pipeline", "s3://example-bucket/export", 3, "Inconclusive", false],
  ["sig-5", "Role assumption from a TEST-NET address", "sample_assume_role", "Open", "cloudtrail", "High", "192.0.2.55", "arn:aws:iam::123456789012:role/Example", 0, "Suspicious", false],
  ["sig-6", "Public repository received a sample token file", "sample_token_file", "Peer review", "github", "Medium", "p.north@example.com", "example-org/sample-repo", 3, "Benign", false],
  ["sig-7", "Mailbox rule created in the sample tenant", "sample_mailbox_rule", "Open", "google", "Low", "s.case@example.com", "s.case@example.com", 4, "Inconclusive", true],
  ["sig-8", "Scheduled task created on a lab host", "sample_scheduled_task", "Resolved", "crowdstrike-falcon", "Medium", "LAB-HOST-2", "example.local\\lab", 2, "Benign", true],
  ["sig-9", "Impossible travel between two example sites", "sample_impossible_travel", "Open", "okta", "High", "j.demo@example.com", "Example City", 2, "Suspicious", false],
  ["sig-10", "Endpoint alert on a renamed sample binary", "sample_renamed_binary", "In progress", "sentinel", "Critical", "WS-SAMPLE-7", "C:\\Temp\\sample.exe", 1, "Malicious", false],
  ["sig-11", "Lookup of an example domain", "sample_domain_lookup", "Open", "splunk", "Low", "192.0.2.80", "example.com", 4, "Benign", false],
  ["sig-12", "Identity finding on a sample guest account", "sample_guest_account", "Resolved", "wiz", "High", "guest.sample@example.com", "Example subscription", 0, "Inconclusive", false]
];
const INCIDENTS = [
  ["inc-1", "Sample identity incident", "Investigating", "High", "Suspicious", 0, 4],
  ["inc-2", "Sample endpoint incident", "New", "Critical", "Malicious", 1, 2],
  ["inc-3", "Sample cloud storage incident", "On hold", "Medium", "Inconclusive", 3, 3],
  ["inc-4", "Sample source-control incident", "External escalation", "Medium", "Benign", 3, 1],
  ["inc-5", "Sample mail incident", "Resolved", "Low", "Benign", 4, 2],
  ["inc-6", "Sample reopened finding", "Reopened", "High", "Suspicious", 2, 2]
];
const DETECTS = [
  ["det-1", "Sample sign-in burst", "Configured", "Okta", "High"],
  ["det-2", "Sample OAuth grant", "Configured", "Entra ID", "High"],
  ["det-3", "Sample object upload", "Library", "Amazon S3", "Medium"],
  ["det-4", "Sample role assumption", "Library", "CloudTrail", "High"],
  ["det-5", "Sample token in a repository", "SIEM", "GitHub", "Medium"],
  ["det-6", "Sample scheduled task", "SIEM", "CrowdStrike", "Medium"]
];
const BOOKS = [
  ["nb-1", "Sample identity questions", "Mine"],
  ["nb-2", "Sample cloud questions", "Mine"],
  ["nb-3", "Vega library: sign-in overview", "Library"],
  ["nb-4", "Vega library: endpoint overview", "Library"]
];
const BOARDS = [
  ["ops", "Operations"], ["coverage", "Coverage"], ["response", "Response"]
];
const BRIEFS = [
  ["brief-1", "Sample brief: credential use", "Critical"],
  ["brief-2", "Sample brief: public repository", "High"],
  ["brief-3", "Sample brief: guest account", "Medium"]
];
const SKILLS = [
  ["skill-1", "Summarize a signal", "Read"],
  ["skill-2", "Draft a detection", "Write"],
  ["skill-3", "Explain a verdict", "Read"]
];
const MEMORIES = [
  ["mem-1", "Sample preference: example.com is a documentation domain"],
  ["mem-2", "Sample preference: TEST-NET addresses are not production"]
];
const CONNECTORS = [
  ["okta", "Okta", "Configured"], ["microsoft-entraid", "Microsoft Entra ID", "Configured"],
  ["crowdstrike-falcon", "CrowdStrike Falcon", "Configured"], ["amazon-s3", "Amazon S3", "Library"],
  ["github", "GitHub", "Configured"], ["splunk", "Splunk", "Library"],
  ["sentinel", "Microsoft Sentinel", "Configured"], ["wiz", "Wiz", "Error"]
];
let collapsed = false;
let section = null;
let q = "";
let sev = "All";
let status = "All";
let testMode = false;
let composerMode = "ask";
let toast = "";

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function ico(name, cls) { return `<svg class="ico${cls ? " " + cls : ""}" aria-hidden="true"><use href="sprite.svg#${esc(name)}"></use></svg>`; }
function person(i) { const p = PEOPLE[i % PEOPLE.length]; return `<span class="who"><span class="av" style="background:${p[1]}">${esc(p[0][0])}</span>${esc(p[0])}</span>`; }
function source(id) { const s = SOURCES.find(x => x[0] === id) || [id, id]; return `<span class="src">${ico(s[0])}${esc(s[1])}</span>`; }
function sevPill(name) {
  const color = { Critical: "var(--sev-crit)", High: "var(--sev-high)", Medium: "var(--sev-med)", Low: "var(--sev-low)" }[name] || "var(--subtle)";
  return `<span class="sev" style="background:${color}">${esc(name)}</span>`;
}
function statusPill(name) {
  const color = { Open: "var(--positive)", New: "var(--positive)", Investigating: "var(--warning)", "In progress": "var(--warning)", "Peer review": "var(--brand)", Resolved: "var(--subtle)", "On hold": "var(--subtle)", "External escalation": "var(--sev-high)", Reopened: "var(--sev-med)", Configured: "var(--positive)", Library: "var(--brand)", SIEM: "var(--subtle)", Error: "var(--destructive)", Mine: "var(--brand)" }[name] || "var(--subtle)";
  return `<span class="pill"><i style="background:${color}"></i>${esc(name)}</span>`;
}
function path() {
  let h = decodeURIComponent(location.hash.replace(/^#/, "") || "/incidents/signals");
  if (!h.startsWith("/")) h = "/" + h;
  if (h === "/alerts" || h === "/incidents/alerts") h = "/incidents/signals";
  return h;
}
function go(p) { location.hash = p; }
function itemFor(p) {
  for (const item of NAV) {
    if (item.path === p) return item;
    if (item.children && item.children.some(([c]) => p === c || p.startsWith(c + "/"))) return item;
    if (p === item.path || p.startsWith(item.path + "/")) return item;
  }
  return null;
}
function crumb(parts) {
  return `<div class="crumbs">${parts.map((p, i) => `${i ? '<span class="slash">/</span>' : ""}${i === parts.length - 1 ? `<b>${esc(p)}</b>` : esc(p)}`).join("")}</div>`;
}
function shell(crumbs, body, tabs) {
  return `<div class="app">${rail()}<div class="stage"><div class="panel">${tabs || ""}<div class="top">${crumbs}<span class="spacer"></span><button class="btn" type="button" id="ask" data-testid="ask-sam-button">${ico("sparkles")} Ask Sam</button></div><div class="scroll"><div class="pad">${body}<p class="note">Sample rows only. The public app.vega.io bundles describe this layout and do not include a tenant export. Nothing on this page signs in.</p></div></div></div></div></div>${toast ? `<div class="toast">${esc(toast)}</div>` : ""}`;
}
function rail() {
  const p = path();
  const current = itemFor(p);
  const open = section && NAV.find(n => n.path === section);
  const items = open && open.children ? open.children.map(([c, name]) => ({ path: c, name, icon: open.icon, child: true })) : NAV.filter(n => n.section !== "bottom");
  const bottom = open ? [] : NAV.filter(n => n.section === "bottom");
  const btn = (item) => {
    const on = item.child ? p === item.path || p.startsWith(item.path + "/") : itemFor(p)?.path === item.path;
    return `<button class="nav-btn${on ? " on" : ""}" type="button" data-go="${esc(item.child ? item.path : item.path)}" data-section="${item.child ? "" : esc(item.path)}" title="${esc(item.name)}">${ico(item.icon)}<span class="lbl">${esc(item.name)}</span>${item.soon ? '<span class="soon">Soon</span>' : ""}</button>`;
  };
  return `<nav class="rail${collapsed ? " collapsed" : ""}" aria-label="Primary">
    <div class="rail-top"><a class="brand" href="#/search" aria-label="Vega">${ico("vega-full-logo", "logo")}</a>
      <button class="icon-btn" id="rail-toggle" type="button" aria-label="${collapsed ? "Expand sidebar" : "Collapse sidebar"}">${ico("vega", "flower")}${ico("sidebar-expand", "when-shut")}${ico("sidebar-collapse", "when-open")}</button></div>
    <div class="rail-scroll">${open ? `<button class="back-btn" type="button" id="back" aria-label="Back to main menu from ${esc(open.name)}">${ico("central/IconArrowLeft")}<span class="lbl">${esc(open.name)}</span></button>` : ""}${items.map(btn).join("")}
      <div class="rail-bottom">${bottom.map(btn).join("")}</div>
      <button class="tenant" type="button" id="tenant" title="Switch tenant"><span class="mark">${ico("vega")}</span><span><b>VegaSecurity</b><small>Sample workspace</small></span></button>
    </div></nav>`;
}
function tabs(item) {
  if (!item || !item.children) return "";
  const p = path();
  return `<div class="tabs">${item.children.map(([c, name]) => `<button type="button" class="${p === c || p.startsWith(c + "/") ? "on" : ""}" data-go="${c}">${esc(name)}</button>`).join("")}</div>`;
}
function table(heads, rows) {
  if (!rows.length) return `<div class="empty"><b>No matching signals</b><div>Try adjusting your search or filters</div></div>`;
  return `<table><thead><tr>${heads.map(h => `<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table>`;
}
function sevStack(rows, index) {
  const order = ["Critical", "High", "Medium", "Low"];
  const counts = { Critical: 0, High: 0, Medium: 0, Low: 0 };
  rows.forEach(row => { if (counts[row[index]] != null) counts[row[index]] += 1; });
  return order.map(name => counts[name]);
}
function funnel() {
  const stages = [
    ["Total signals", SIGNALS, 5, "/incidents/signals"],
    ["Escalated", SIGNALS.filter(s => s[9] === "Malicious" || s[9] === "Suspicious"), 5, "/incidents/signals"],
    ["Incidents", INCIDENTS, 3, "/incidents/list"],
    ["Needs review", SIGNALS.filter(s => s[3] === "In progress" || s[3] === "Peer review"), 5, "/incidents/signals"]
  ];
  const colors = ["var(--sev-crit)", "var(--sev-high)", "var(--sev-med)", "var(--sev-low)"];
  return `<div class="funnel" aria-label="Triage funnel">${stages.map(s => {
    const parts = sevStack(s[1], s[2]);
    const sum = parts.reduce((a, b) => a + b, 0) || 1;
    return `<button class="stage-card" type="button" data-go="${s[3]}"><span class="count">${esc(s[0])}</span><b>${s[1].length}</b><span class="bars">${parts.map((n, i) => `<span style="width:${n / sum * 100}%;background:${colors[i]}"></span>`).join("")}</span></button>`;
  }).join("")}</div>`;
}
function signalRows() {

function login() {

function bind() {
  document.querySelectorAll("[data-go]").forEach(el => el.addEventListener("click", () => {
    const dest = el.getAttribute("data-go");
    const sectionAttr = el.getAttribute("data-section");
    if (sectionAttr) {
      const item = NAV.find(n => n.path === sectionAttr);
      section = item && item.children ? item.path : null;
    }
    go(dest);
  }));
  document.querySelectorAll("[data-sev]").forEach(el => el.addEventListener("click", () => { sev = el.getAttribute("data-sev"); render(); }));
  document.querySelectorAll("[data-status]").forEach(el => el.addEventListener("click", () => { status = el.getAttribute("data-status"); render(); }));
  const qel = document.getElementById("q");
  if (qel) qel.addEventListener("input", () => { q = qel.value; render(); const again = document.getElementById("q"); if (again) { again.focus(); again.setSelectionRange(q.length, q.length); } });
  const askMode = document.getElementById("ask-mode");
  const queryMode = document.getElementById("query-mode");
  if (askMode) askMode.addEventListener("click", () => { composerMode = "ask"; render(); });
  if (queryMode) queryMode.addEventListener("click", () => { composerMode = "query"; render(); });
  const all = document.getElementById("mode-all");
  const test = document.getElementById("mode-test");
  if (all) all.addEventListener("click", () => { testMode = false; render(); });
  if (test) test.addEventListener("click", () => { testMode = true; render(); });
  const toggle = document.getElementById("rail-toggle");
  if (toggle) toggle.addEventListener("click", () => { collapsed = !collapsed; render(); });
  const back = document.getElementById("back");
  if (back) back.addEventListener("click", () => { section = null; go("/search"); });
  const ask = document.getElementById("ask");
  if (ask) ask.addEventListener("click", () => { toast = "Ask Sam stays in this sample."; render(); });
  const tenant = document.getElementById("tenant");
  if (tenant) tenant.addEventListener("click", () => { toast = "Switch tenant stays in this sample. Workspace name VegaSecurity is a string from the public bundle."; render(); });
  const auth = document.getElementById("auth");
  if (auth) auth.addEventListener("submit", e => { e.preventDefault(); go("/search"); });
  const sso = document.getElementById("sso");
  if (sso) sso.addEventListener("click", () => go("/search"));
  const email = document.getElementById("email");
  if (email) email.addEventListener("click", () => { toast = "Continue with email stays on this sign-in card."; render(); });
  const run = document.getElementById("run-search");
  if (run) run.addEventListener("click", () => { q = document.getElementById("composer").value; go("/incidents/signals"); });
  document.querySelectorAll("[data-fill]").forEach(el => el.addEventListener("click", () => { const box = document.getElementById("composer"); if (box) box.value = el.getAttribute("data-fill"); }));
  const save = document.getElementById("save-nb");
  if (save) save.addEventListener("click", () => { toast = "Sample only. No notebook was saved."; render(); });
}
function render() {
  const here = itemFor(path());
  section = here && here.children && (path() === here.path || path().startsWith(here.path + "/")) ? here.path : null;
  document.getElementById("root").innerHTML = page();
  bind();
  if (toast) setTimeout(() => { if (toast) { toast = ""; render(); } }, 2400);
}
window.addEventListener("hashchange", () => { q = ""; sev = "All"; status = "All"; testMode = false; composerMode = "ask"; toast = ""; render(); });
if (!location.hash) location.hash = "/incidents/signals";
else render();
