  const bodies = { funnel, roi, baselines, peloton, bank, defense };
  return `<header class="topbar"><span class="crumb">Dashboards${id === "roi" ? " / Security ROI" : ""}</span></header><div class="scroll"><div class="pad">${nav}${bodies[id] || funnel}</div></div>`;
}

  const ideas = ["Show me all login events by browser name","Show senders that sent emails to a large number of recipients","Show email subjects that were sent to large number of recipients","Show the IP addresses sending the most emails"];

    <p class="sub">Explore with KQL. Search across all your data sources with KQL. Search with KQL, select a data source, or ask Vega to write a query.</p>

}
const pages = { alerts: alertsPage, incident: incidentPage, detections: detectionsPage, search: searchPage, notebooks: notebooksPage, intel: intelPage, connectors: connectorsPage, coverage: coveragePage, dashboards: dashPage, skills: skillsPage, prefs: prefsPage };
function bindRail() {
  document.querySelectorAll("#rail [data-go]").forEach((el) => el.addEventListener("click", (e) => { e.preventDefault(); go(el.getAttribute("data-go")); }));
  const tog = document.getElementById("rail-toggle");
  if (tog) tog.addEventListener("click", () => { railOpen = !railOpen; rail(); bindRail(); });
}
function bind() {
  document.querySelectorAll("#panel [data-go]").forEach((el) => el.addEventListener("click", (e) => { e.preventDefault(); go(el.getAttribute("data-go")); }));
  bindRail();
  document.querySelectorAll("[data-cat]").forEach((el) => el.addEventListener("click", () => { cat = el.getAttribute("data-cat"); render(); }));
  document.querySelectorAll("[data-ask]").forEach((el) => el.addEventListener("click", () => {
    q = el.getAttribute("data-ask");
    if (route().page === "search" && route().id === "river") { keepQ = true; go("search"); return; }
    render();
    const n = document.getElementById("q");
    if (n) n.focus();
  }));
  const qel = document.getElementById("q");
  if (qel) qel.addEventListener("input", () => { q = qel.value; const pos = qel.selectionStart; render(); const n = document.getElementById("q"); if (n) { n.focus(); if (n.setSelectionRange) n.setSelectionRange(pos, pos); } });
  const ask = document.getElementById("ask");
  if (ask) ask.addEventListener("click", () => { const n = document.getElementById("q"); q = n ? n.value : q; render(); });
  const conf = document.getElementById("tab-conf"), ext = document.getElementById("tab-ext");
  if (conf) conf.addEventListener("click", () => { detTab = "configured"; render(); });
  if (ext) ext.addEventListener("click", () => { detTab = "external"; render(); });
  const lib = document.getElementById("tab-lib"), cfg = document.getElementById("tab-cfg"), mcp = document.getElementById("tab-mcp");
  if (lib) lib.addEventListener("click", () => { connTab = "library"; render(); });
  if (cfg) cfg.addEventListener("click", () => { connTab = "configured"; render(); });
  if (mcp) mcp.addEventListener("click", () => { connTab = "mcp"; render(); });
}
function render() {
  const draw = pages[route().page];
  rail();
  document.getElementById("panel").innerHTML = draw ? draw() : `<header class="topbar"><span class="crumb">Not captured</span></header><div class="scroll"><div class="pad"><p>This route is not one of the public screens.</p><button class="linkish" data-go="alerts" type="button">Back to alerts</button></div></div>`;
  bind();
}
let keepQ = false;
window.addEventListener("hashchange", () => { if (!keepQ) q = ""; keepQ = false; render(); });
if (!location.hash) location.hash = "#/alerts";
render();
</script>
