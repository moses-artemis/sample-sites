  .bell { position: relative; font-size: 16px; }
  .bell b { position: absolute; top: -7px; right: -10px; background: #e11d48; color: #fff; border-radius: 99px; font-size: 10px; min-width: 16px; text-align: center; padding: 1px 4px; }
  .who { background: none; border: 0; color: #fff; text-align: right; cursor: pointer; padding: 4px; }
  .who small { display: block; color: #aeb6c2; font-size: 12px; }
  .menu { position: absolute; right: 12px; top: 52px; background: #fff; color: var(--ink); border: 1px solid var(--line); border-radius: 12px; min-width: 220px; box-shadow: 0 12px 32px rgba(16,24,40,.12); padding: 6px; z-index: 30; }
  .menu a { display: block; padding: 8px 10px; border-radius: 8px; }
  .menu a:hover { background: #f4f5f8; }
  .layout { display: flex; min-height: calc(100vh - 56px); }
  .assist { width: 36px; flex: none; writing-mode: vertical-rl; transform: rotate(180deg); display: flex; align-items: center; justify-content: center; gap: 8px; color: #98a2b3; font-size: 12px; letter-spacing: .04em; border-right: 1px solid var(--line); background: #f7f8fb; }
  .assist[hidden] { display: none; }
  body[data-theme="dark"] { background: #1c1f26; color: #e7e9ee; }

  body[data-theme="dark"] th { background: #1c1f26; }
  main { flex: 1; min-width: 0; padding: 18px 22px 56px; }
  .sub { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 14px; }
  .sub a { background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; color: #344054; }
  .sub a.on { background: var(--header); color: #fff; border-color: var(--header); }
  .crumb { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
  .crumb b { color: var(--ink); font-weight: 650; }
  h1 { font-size: 26px; letter-spacing: -0.03em; margin: 0 0 12px; font-weight: 650; }
  h2 { font-size: 15px; margin: 0 0 8px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  .grow { flex: 1; }
  .pill, .chip { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 4px 10px; color: #344054; }
  .fly { margin-left: auto; background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 8px 12px; cursor: pointer; }
  .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; }
  .grid2 { display: grid; grid-template-columns: 1.2fr .8fr; gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; }
  .card h3 { margin: 0; font-size: 16px; }
  .subd { color: var(--muted); margin: 2px 0 12px; }
  .kicker { font-size: 11px; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
  .stat { font-size: 40px; font-weight: 650; letter-spacing: -0.04em; line-height: 1; }
  .stat span, .unit { font-size: 13px; font-weight: 550; color: var(--muted); }
  .link { color: var(--link); cursor: pointer; background: none; border: 0; padding: 0; text-align: left; }
  .hit { display: flex; justify-content: space-between; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); }
  .tag { display: inline-block; border-radius: 999px; padding: 2px 8px; font-size: 11px; font-weight: 750; letter-spacing: .03em; }
  .mal { background: #fde8ec; color: var(--red); }
  .ben { background: #eceff3; color: #475467; }
  .sus { background: #ffedd5; color: var(--orange); }
  .mit { background: #eef2f6; color: #475467; }
  .ok { color: var(--green); font-weight: 650; }
  .crit { color: var(--red); font-weight: 700; }
  .high { color: var(--orange); font-weight: 700; }
  .med { color: var(--amber); font-weight: 700; }
  table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; color: var(--muted); font-weight: 650; background: #fafbfc; }

  .board { display: grid; grid-template-columns: repeat(4, minmax(230px, 1fr)); gap: 12px; align-items: start; }

  .tabs { display: flex; gap: 16px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }

  input[type=search], input[type=text], select, textarea { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  textarea { width: 100%; min-height: 140px; }

  .sankey { background: #fff; border: 1px solid var(--line); border-radius: 16px; margin-bottom: 14px; overflow: auto; }

  .kpi4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .hot { color: #e11d48; }
  .swatch { width: 8px; height: 8px; border-radius: 99px; display: inline-block; margin-right: 6px; }
  .ring { width: 84px; height: 84px; }
  .split { display: flex; gap: 16px; align-items: center; }

function tabOn(href, r) {
  const [sa, sb] = href.split("/");
  if (sa==="investigate" && sb==="all" && INV.some(i=>i.id===r.b)) return true;
  if (sa==="respond" && sb==="cases" && r.b==="case") return true;
  if (sa==="hunt" && sb==="emerging" && r.b==="report") return true;
  if (sa==="build" && !sb && r.b==="report") return true;
  if (sa==="memory" && sb==="skills" && (r.b==="skill" || r.b==="new")) return true;
  if (sa==="memory" && !sb && r.a==="memory" && ["","generated","suggestions","prevalence","audit"].includes(r.b)) return true;
  if (sa==="respond" && !sb && r.a==="respond" && ["","mtta","mtti","mttr"].includes(r.b)) return true;
  if (sa==="settings" && r.a==="settings") return !sb;
  if (!sb) return r.a===sa && !r.b;
  return r.a===sa && r.b===sb;
}
